plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.everest.stream'
    compileSdk 34

    defaultConfig {
        applicationId "com.everest.stream"
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

configurations {
    aautoSdkAar
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // Download the AAR into a custom configuration so we can extract classes.jar
    // and ignore its legacy res/values/ids.xml that breaks AAPT2
    aautoSdkAar 'com.github.martoreto:aauto-sdk:v4.0@aar'
    implementation files("${buildDir}/extracted-aauto-sdk/classes.jar")
}

tasks.register('extractAautoSdkJar', Copy) {
    dependsOn configurations.aautoSdkAar
    from {
        configurations.aautoSdkAar.collect { zipTree(it) }
    }
    include 'classes.jar'
    into "${buildDir}/extracted-aauto-sdk"
}

preBuild.dependsOn extractAautoSdkJar